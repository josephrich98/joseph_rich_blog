name: Test_notebooks_conda

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install Python dependencies
      run: |
        conda env update --file environment.yml --name base
        conda install -c conda-forge pytest nbdime nbformat nbval pandoc

    - name: Install LaTeX toolchain (Eisvogel dependencies)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-xetex texlive-latex-base texlive-latex-extra \
          texlive-fonts-recommended texlive-fonts-extra latexmk

    - name: Download Eisvogel template
      run: |
        scripts/download_eisvogel.sh

    - name: Run tests (post notebooks + PDF build)
      run: |
        pytest -v tests/