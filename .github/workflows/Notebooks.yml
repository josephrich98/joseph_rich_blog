name: Test_notebooks_conda

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Install Python dependencies
      run: |
        # Use a dedicated env, never `base`: the post environment.yml files pin
        # conda packages (python, pandoc, ...), which forces a re-solve of base
        # and fails with "RemoveError: 'tqdm' is a dependency of conda and cannot
        # be removed" because conda protects its own operating dependencies.
        # environment.yml now lives in each post directory; merge them all in.
        conda create -y --name test-env
        for env in posts/*/environment.yml; do
          conda env update --file "$env" --name test-env
        done
        conda install -y --name test-env -c conda-forge pytest nbdime nbformat nbval pandoc

    - name: Install LaTeX toolchain (Eisvogel dependencies)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-xetex texlive-latex-base texlive-latex-extra \
          texlive-fonts-recommended texlive-fonts-extra latexmk

    - name: Download Eisvogel template
      run: |
        scripts/download_eisvogel.sh

    - name: Run tests (post notebooks + PDF build)
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate test-env
        pytest -v tests/