name: BioCartoon metrics

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biocartoon-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public counts
        env:
          BIOCARTOON_GITHUB_TOKEN: ${{ secrets.BIOCARTOON_GITHUB_TOKEN }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: python scripts/update_biocartoon_metrics.py
      - name: Commit changed counts
        run: |
          if git diff --quiet -- site/_data/biocartoon_metrics.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/_data/biocartoon_metrics.json
          git commit -m "Update BioCartoon usage metrics"
          git push
