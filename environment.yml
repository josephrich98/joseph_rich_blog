name: joseph_rich_blog
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.16
  # Ruby toolchain for building/serving the Jekyll site in site/ (academicpages).
  # The compilers + pkg-config are needed because this host (RHEL 8, glibc 2.28)
  # must compile native gems (nokogiri, sass-embedded) from source via
  # `bundle config set --local force_ruby_platform true`.
  - ruby=3.3
  - c-compiler
  - cxx-compiler
  - pkg-config
  - pandoc=3.9.0.2
  - pip=25.1
  - ipykernel=6.29.5
  - ipython=8.36.0
  - jupyter_client=8.6.3
  - jupyter_core=5.7.2
  - pip:
      - anndata==0.11.4
      - array-api-compat==1.12.0
      - contourpy==1.3.2
      - cycler==0.12.1
      - fonttools==4.58.0
      - h5py==3.13.0
      - joblib==1.5.1
      - kiwisolver==1.4.8
      - legacy-api-wrap==1.4.1
      - llvmlite==0.44.0
      - matplotlib==3.10.3
      - natsort==8.4.0
      - networkx==3.4.2
      - numba==0.61.2
      - numpy==2.2.6
      - pandas==2.2.3
      - patsy==1.0.1
      - pillow==11.2.1
      - pynndescent==0.5.13
      - pyparsing==3.2.3
      - pytz==2025.2
      - scanpy==1.11.1
      - scikit-learn==1.5.2
      - scipy==1.15.3
      - seaborn==0.13.2
      - session-info2==0.1.2
      - statsmodels==0.14.4
      - threadpoolctl==3.6.0
      - tqdm==4.67.1
      - tzdata==2025.2
      - umap-learn==0.5.7
      - nbval==0.11.0
      - nbformat==5.10.4
      - nbconvert==7.3.1
      - jupyterlab==3.2.1
      - pytest==9.0.3
