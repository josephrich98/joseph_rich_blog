{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/">{{ site.title }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>

    <div class="masthead__aside">
      <div class="site-search">
        <i class="fa-solid fa-magnifying-glass site-search__icon" aria-hidden="true"></i>
        <input id="site-search-input" class="site-search__input" type="search"
               placeholder="Search posts&hellip;" aria-label="Search posts" autocomplete="off">
        <ul id="site-search-results" class="site-search__results" role="listbox" aria-label="Search results"></ul>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light/dark theme">
        <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i>
      </button>
    </div>
  </div>
</div>
