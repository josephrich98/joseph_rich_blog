# Open-source packages listed on /software/ (rendered by _pages/software.html).
# Entries are listed in descending order of GitHub stars (snapshot: 2026-08-13);
# re-sort when adding an entry or when the counts have drifted. The stars badge
# itself is live, so only the ordering here goes stale.
# Fields:
#   title       display name
#   url         where the heading links (the GitHub repo, unless the project has its own site)
#   repo        owner/name on GitHub — drives the stars badge (omit for no badge)
#   pypi        PyPI project name — drives the pepy download-count badge (omit for no badge)
#   image       a figure from the repo's README, downscaled into /images/software/
#   image_size  "large" for app screenshots, which need more height than a logo
#   links       extra destinations shown under the description, as a list of {label, url}
#   manuscript  venue + link for the accompanying paper (update the venue on journal acceptance)

# 207 stars. Image is the Nature portal screenshot from the repo's
# docs/portal_screenshots/ (the README has no figure).
- title: "paperpush"
  url: "https://github.com/pachterlab/paperpush"
  repo: "pachterlab/paperpush"
  pypi: "paperpush"
  image: "/images/software/paperpush.png"
  description: "Automates manuscript submission. Point it at a manuscript directory and a target venue and it generates a submission file, validates it against the venue's pre-submission checks, and fills out the submission portal for you — stopping short of clicking submit. Supports arXiv, bioRxiv, and medRxiv along with a growing list of journals."

# 33 stars. The repo has no image on any branch, so none is shown.
- title: "fastQpick"
  url: "https://github.com/pachterlab/fastQpick"
  repo: "pachterlab/fastQpick"
  pypi: "fastQpick"
  description: "Fast, memory-efficient sampling of FASTQ reads with or without replacement — for generating bootstrap replicates that quantify technical variance at the level of raw reads, and for subsampling large libraries for testing and benchmarking. Streaming I/O and ISA-L-accelerated gzip bootstrap a 500-million-read library in roughly 26 minutes."
  manuscript:
    venue: "bioRxiv"
    url: "https://doi.org/10.64898/2026.06.23.734068"

# 31 stars
- title: "wompwomp"
  url: "https://github.com/pachterlab/wompwomp"
  repo: "pachterlab/wompwomp"
  image: "/images/software/wompwomp.png"
  description: "R package (on CRAN) that untangles k-partite graphs by heuristically optimizing node order, layer order, and node grouping to nearly minimize edge crossings. Its main use is making alluvial plots legible when the raw category ordering leaves the flows in a knot."
  manuscript:
    venue: "arXiv"
    url: "https://doi.org/10.48550/arXiv.2509.03761"

# 26 stars
- title: "cellsweep"
  url: "https://github.com/pachterlab/cellsweep"
  repo: "pachterlab/cellsweep"
  pypi: "cellsweep"
  image: "/images/software/cellsweep.png"
  description: "Python package and CLI that sweeps noisy, ambient counts out of single-cell RNA-seq data. A single call to <code>denoise_count_matrix</code> takes a raw AnnData count matrix with cell-type labels and returns a denoised one, plus utilities for the downstream processing, plotting, and analysis."
  manuscript:
    venue: "bioRxiv"
    url: "https://doi.org/10.64898/2026.03.04.709349"

# 19 stars
- title: "varseek"
  url: "https://github.com/pachterlab/varseek"
  repo: "pachterlab/varseek"
  pypi: "varseek"
  image: "/images/software/varseek.png"
  description: "Command-line tool and Python package for variant screening of DNA-seq, bulk RNA-seq, and single-cell RNA-seq data. <code>vk ref</code> turns a variant database (COSMIC, ClinVar, dbSNP, or custom) plus its reference genome/transcriptome into a variant-containing reference sequence (VCRS) index; <code>vk count</code> pseudoaligns reads against that index and returns a samples × variants count matrix in AnnData format, ready for clustering, differential expression, or pathway analysis."
  manuscript:
    venue: "bioRxiv"
    url: "https://doi.org/10.1101/2025.09.03.674039"

# 8 stars. The repo is josephrich98/conference-agent, but `repo` is deliberately
# unset so no stars badge is shown — this entry points at the live site rather
# than GitHub. Its star count still determines its position here.
- title: "Conference Agent"
  url: "https://conferenceagent.vercel.app"
  image: "/images/software/conference-agent.png"
  image_size: large
  description: "AI agent that compiles major conferences across medicine, genomics/bioinformatics, and data science into one searchable table, with website links and color-coded submission deadlines and meeting dates, refreshed biweekly. Any row can be exported as a subscribable calendar feed (<code>.ics</code>)."

# 3 stars. Co-developed (with lakigigar). The repo has no screenshot, so no image.
- title: "Manimble"
  url: "https://github.com/pachterlab/manimble"
  repo: "pachterlab/manimble"
  description: "Co-developed macOS app that gives <a href=\"https://github.com/3b1b/manim\">Manim</a> animations a graphical slideshow editor: a deck is a folder of Manim scene classes, played back as slides, with Keynote import/export, BioCartoon icon search, and a <code>manimbler</code> CLI that converts portable <code>.manimble</code> projects to MP4 or PDF."

# 2 stars (biocartoon) + 3 (biocartoon-app). Heading links to the live site;
# the badge tracks the database/CLI repo, and `links` covers the web app and
# the editor/website repo. Image is the app screenshot from biocartoon-app.
- title: "BioCartoon"
  url: "https://www.biocartoon.com"
  repo: "josephrich98/biocartoon"
  pypi: "biocartoon"
  image: "/images/software/biocartoon.png"
  image_size: large
  description: "Free, open-source tool for making biology figures: a searchable database of 15,000+ open-licensed scientific illustrations with a web and desktop figure editor, plus a CLI and MCP server."
  links:
    - label: "biocartoon.com"
      url: "https://www.biocartoon.com"
    - label: "Web app"
      url: "https://app.biocartoon.com"
    - label: "GitHub (database, CLI, MCP)"
      url: "https://github.com/josephrich98/biocartoon"
    - label: "GitHub (editor and website)"
      url: "https://github.com/josephrich98/biocartoon-app"

# 1 star. No pypi field: the PyPI name "probability_distributions" belongs to an
# unrelated project.
- title: "probability_distributions"
  url: "https://github.com/josephrich98/probability_distributions"
  repo: "josephrich98/probability_distributions"
  image: "/images/software/probability_distributions.png"
  description: "Python package for visualizing and learning probability distributions. A single <code>Distribution</code> object covers 29 discrete, continuous, and multivariate distributions and carries everything you need to know about each one: its story, parameter space, support, PMF/PDF, CDF, mean, variance, MGF, use cases, and special facts. It also draws PMF/PDF/CDF plots, with sliders for the parameters in Jupyter, and samples from the distribution."

# 0 stars. Replaced tcia-radiology-processing, whose protocol this package
# implements — the image is that repo's figure, which ctkit ships unchanged.
- title: "ctkit"
  url: "https://github.com/pachterlab/ctkit"
  repo: "pachterlab/ctkit"
  pypi: "ctkit"
  image: "/images/software/tcia-radiology-processing.png"
  description: "Protocol and Python package for turning TCGA/TCIA radiology studies into AI-ready arrays: download and filtering, DICOM → NIfTI conversion, reorientation, segmentation, Hounsfield-unit clipping, resampling, mask-and-crop, and intensity normalization, with Jupyter notebooks walking through each step."
  manuscript:
    venue: "medRxiv"
    url: "https://doi.org/10.64898/2026.06.15.26354651"

