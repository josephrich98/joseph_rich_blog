# Site-wide configuration for joseph-rich.com
# (based on the academicpages / Minimal Mistakes theme, trimmed to a blog).
# NOTE: _config.yml is NOT reloaded on `jekyll serve` — restart the server after edits.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # "default", "air", "sunrise", "mint", "dirt", "contrast"
title                    : "Joseph Rich"
title_separator          : "-"
name                     : &name "Joseph Rich"
description              : &description "Blog and writing by Joseph Rich on machine learning, bioinformatics, and radiology."
url                      : https://joseph-rich.com   # primary domain; also reachable at https://joseph-rich-blog.vercel.app
baseurl                  : ""                          # subpath, e.g. "/blog" (leave blank)
repository               : "josephrich98/joseph_rich_blog"   # used by giscus comments

# Site Author — controls the left sidebar profile. Blank fields hide their icon/link.
author:
  avatar           : "headshot.jpg"   # in /images/
  name             : "Joseph Rich"
  pronouns         :
  bio              : "MD/PhD student at USC/Caltech researching multimodal medical AI and bioinformatics methods development."
  location         :
  employer         :
  uri              :
  email            : "josephrich98@gmail.com"

  # Academic profiles
  googlescholar    : "https://scholar.google.com/citations?user=vtDtrHoAAAAJ"
  orcid            : "https://orcid.org/0000-0003-1400-8479"
  pubmed           :

  # Code / social
  github           : "josephrich98"
  linkedin         : "joseph-rich-5bb533123"   # the username after /in/

# Publication categories shown (and their headings) on the Publications page
publication_category:
  original_research:
    title: 'Original Research'
  preprints:
    title: 'Preprints'
  oral_presentations:
    title: 'Oral Presentations'
  reviews:
    title: 'Reviews'
  case_reports:
    title: 'Case Reports'
  research_highlights:
    title: 'Research Highlights'

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"

# Comments — giscus (GitHub Discussions) via the "custom" provider.
# Fill repo_id and category_id from https://giscus.app (see site/README.md).
comments:
  provider               : "custom"
giscus:
  repo_id                : "R_kgDOOv6a9Q"  # repo node id (from giscus.app)
  category               : "Announcements" # the Discussions category name
  category_id            : "DIC_kwDOOv6a9c4C-Olm"  # from giscus.app
  discussion_term        : "pathname"      # mapping: pathname | url | title | og:title
  reactions_enabled      : "1"
  theme                  : "preferred_color_scheme"

atom_feed:
  hide                   : false

# SEO
google_site_verification :
bing_site_verification   :

# Analytics
analytics:
  provider               : "custom"   # "false", "google-analytics-4", "custom"
  google:
    tracking_id          :

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - markdown_generator
  - node_modules
  - package.json*
  - Rakefile
  - README.md
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections — only publications (talks/teaching/portfolio dropped)
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults for pages and collections
defaults:
  # _posts (blog)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives — plugin-free Liquid archives so the Vercel build needs no extra gems.
# Tags power the blog's topic pages (machine learning, bioinformatics, ...).
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
