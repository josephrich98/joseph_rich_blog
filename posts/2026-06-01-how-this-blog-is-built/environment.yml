name: how-this-blog-is-built
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.16
  - pip=25.1
  # pandoc is a binary (not meaningfully pip-installable), so it lives here at
  # the conda level; it renders this post's PDF and resolves its [@key]
  # citations against references.bib. ipykernel is pinned in requirements.txt
  # (installed by the pip block below), so it is already part of this env.
  - pandoc
  - pip:
      - -r requirements.txt
